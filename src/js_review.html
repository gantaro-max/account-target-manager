<script>
  // js_review.html — レビュー・設問管理

  function changeSummaryUser(uid) {
    targetUserId = uid;
    renderSummary();
  }

  function changeMonth(dir) {
    currentMonth += dir;
    if (currentMonth > 12) {
      currentMonth = 1;
      currentYear++;
    }
    if (currentMonth < 1) {
      currentMonth = 12;
      currentYear--;
    }
    renderSummary();
  }

  function collectBasicInfo() {
    if (t3HospId !== "new") {
      const h = db.accounts.find((h) => h.id === t3HospId);
      if (h && $("h-name").value) {
        h.code = $("h-code").value;
        h.name = $("h-name").value;
        h.addr = $("h-addr").value;
        h.corp = $("h-corp").value;
        h.beds = $("h-beds").value;
        h.partner = $("h-partner").value;
        h.deptList = $("h-dept-list").value;
        h.ward = $("h-ward").value;
        h.priority = $("h-priority").value;
        h.note = $("h-note").value;
        h.equipment = $("h-equipment").value;
      }
    }
  }

  // オートセーブ化: 月次レビュー
  function saveReviewAuto() {
    const mk = `${currentYear}-${currentMonth}`;
    const checks = {};
    db.checkItems.forEach((q) => {
      const cb = $(`chk-${q.id}`);
      if (cb) checks[q.id] = cb.checked;
    });

    const rev = {
      userId: targetUserId,
      yearMonth: mk,
      eval: $("mgr-eval") ? $("mgr-eval").value : "",
      comment: $("mgr-comment") ? $("mgr-comment").value : "",
      checks: checks,
    };

    if (!db.reviews[targetUserId]) db.reviews[targetUserId] = {};
    db.reviews[targetUserId][mk] = rev;

    showSaving();
    google.script.run
      .withSuccessHandler(showSuccess)
      .withFailureHandler((e) => showError(e, "月次レビューの保存に失敗しました"))
      .saveMonthlyReview(rev);
  }

  // ------------------------------------
  // 設問管理の描画とボタンアクション
  // ------------------------------------
  function renderAdminCheckItems() {
    if ($("admin-check-items-list")) {
      $("admin-check-items-list").innerHTML =
        db.checkItems
          .map(
            (q, idx) => `
            <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee; align-items:flex-start; gap:8px; ${!q.isActive ? "background-color: #f8fafc; opacity: 0.6;" : ""}">
              <div style="font-size:13px; font-weight:500; color: ${!q.isActive ? "var(--gray)" : "var(--navy)"}; flex:1; min-width:0; word-break:break-all; padding-top:2px;">
                ${!q.isActive ? '<span style="color:var(--gray); font-size:11px; font-weight:bold; margin-right:4px;">[非表示]</span>' : ""}
                ${q.text}
              </div>
              <div style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
                <button class="control-btn" style="padding: 2px 6px; font-size:11px;" onclick="moveCheckItem(${idx}, -1)" ${idx === 0 ? "disabled" : ""}>▲ 上へ</button>
                <button class="control-btn" style="padding: 2px 6px; font-size:11px;" onclick="moveCheckItem(${idx}, 1)" ${idx === db.checkItems.length - 1 ? "disabled" : ""}>▼ 下へ</button>
                ${
                  q.isActive
                    ? `<button class="del-btn" style="margin-left: 8px;" onclick="hideCheckItem('${q.id}')">非表示</button>`
                    : `<button class="del-btn" style="margin-left: 8px; color: var(--teal); border-color: var(--teal);" onclick="showCheckItem('${q.id}')">表　示</button>`
                }
                <button class="del-btn" style="margin-left: 4px; color: var(--red); border-color: var(--red);" onclick="deleteCheckItemPhysical('${q.id}')">完全削除</button>
              </div>
            </div>
          `,
          )
          .join("") || '<div class="section-note">設問がありません</div>';
    }
  }

  // 配列から消さずにフラグを落とす（通信はせず画面のみ更新）
  function hideCheckItem(id) {
    showConfirm(
      "この設問を非表示にしますか？\n※担当者の入力画面からは消えますが、管理画面には残り、過去の回答データも保持されます。",
      "設問の非表示確認",
      () => {
        const item = db.checkItems.find((q) => q.id === id);
        if (item) item.isActive = false;
        renderAdminCheckItems();
        renderSummary();
      },
      "非表示にする",
    );
  }

  // 非表示から表示に戻す（通信はせず画面のみ更新）
  function showCheckItem(id) {
    const item = db.checkItems.find((q) => q.id === id);
    if (item) item.isActive = true;

    renderAdminCheckItems();
    renderSummary();
  }

  // 新規設問の追加（通信はせず画面のみ更新）
  function addCheckItem() {
    const text = $("new-check-item-text").value;
    if (!text) return;

    const newItem = {
      id: "q_" + Date.now(),
      text: text,
      sortOrder: db.checkItems.length + 1,
      isActive: true,
    };
    db.checkItems.push(newItem);
    $("new-check-item-text").value = "";

    renderAdminCheckItems();
    renderSummary();
  }

  // オートセーブ: 順番入れ替え
  function moveCheckItem(index, direction) {
    if (index + direction < 0 || index + direction >= db.checkItems.length)
      return;

    const temp = db.checkItems[index];
    db.checkItems[index] = db.checkItems[index + direction];
    db.checkItems[index + direction] = temp;

    db.checkItems.forEach((item, i) => {
      item.sortOrder = i + 1;
    });

    renderAdminCheckItems();
    renderSummary();
  }

  // 順番を一括保存する
  function saveCheckItemOrder() {
    showSaving();
    google.script.run
      .withSuccessHandler(showSuccess)
      .withFailureHandler((e) => showError(e, "設問の並び順保存に失敗しました"))
      .updateCheckItemOrder(db.checkItems);
  }

  // 設問の物理削除
  function deleteCheckItemPhysical(id) {
    showConfirm(
      "【警告】この設問を完全に削除しますか？\nデータベースから行が直接削除され、復元できなくなります。",
      "⚠️ 削除の確認",
      () => {
        db.checkItems = db.checkItems.filter((q) => q.id !== id);
        db.checkItems.forEach((item, i) => {
          item.sortOrder = i + 1;
        });

        renderAdminCheckItems();
        renderSummary();

        showSaving();
        google.script.run
          .withSuccessHandler(showSuccess)
          .withFailureHandler((e) => showError(e, "設問の削除に失敗しました"))
          .deleteCheckItem(id);
      },
    );
  }

  function renderSummary() {
    $("summary-month-label").textContent = `${currentYear}年 ${currentMonth}月`;

    const userAccounts = db.accounts.filter(
      (h) => h.assignedUserId === targetUserId,
    );
    const hospIds = userAccounts.map((h) => h.id);

    const monthLogs = db.logs.filter((l) => {
      if (!l.visitDate || !hospIds.includes(l.accountId)) return false;
      const [y, m] = l.visitDate.split("-");
      return parseInt(y) === currentYear && parseInt(m) === currentMonth;
    });

    const activeProps = db.projects.filter(
      (p) =>
        hospIds.includes(p.accountId) &&
        parseInt(p.currentStage || "0") >= 3 &&
        parseInt(p.currentStage || "0") < 4,
    );

    const deptIds = new Set();
    let partnerAccompanyCount = 0;
    monthLogs.forEach((l) => {
      const p = db.projects.find((p) => p.id === l.projectId);
      if (p) deptIds.add(p.departmentId);
      if (l.accompaniedBy && l.accompaniedBy !== "なし") partnerAccompanyCount++;
    });
    $("kpi-depts").textContent = deptIds.size;
    $("kpi-partner").textContent = partnerAccompanyCount;
    $("kpi-proposals").textContent = activeProps.length;

    let filteredProjs = db.projects.filter((p) =>
      hospIds.includes(p.accountId),
    );
    if (currentStageFilter !== "all") {
      filteredProjs = filteredProjs.filter(
        (p) => String(p.currentStage) === String(currentStageFilter),
      );
    }
    if (currentHospNameFilter) {
      const kw = currentHospNameFilter.toLowerCase();
      filteredProjs = filteredProjs.filter((p) => {
        const h = db.accounts.find((h) => h.id === p.accountId);
        return h && h.name.toLowerCase().includes(kw);
      });
    }

    const todayStr = new Date().toISOString().split("T")[0];
    filteredProjs.sort((a, b) => {
      const aO =
        a.nextActionDate &&
        a.nextActionDate < todayStr &&
        a.currentStage !== "4";
      const bO =
        b.nextActionDate &&
        b.nextActionDate < todayStr &&
        b.currentStage !== "4";
      if (aO && !bO) return -1;
      if (!aO && bO) return 1;
      if (!a.nextActionDate) return 1;
      if (!b.nextActionDate) return -1;
      return new Date(a.nextActionDate) - new Date(b.nextActionDate);
    });

    $("summary-integrated-list").innerHTML =
      filteredProjs
        .map((p) => {
          const h = db.accounts.find((h) => h.id === p.accountId);
          const d = db.departments.find((d) => d.id === p.departmentId);
          const isO =
            p.nextActionDate &&
            p.nextActionDate < todayStr &&
            p.currentStage !== "4";

          const bgColor = isO ? "#FEF2F2" : "white";
          const hoverBg = isO ? "#FEE2E2" : "#F8FAFC";
          const borderColor = isO ? "#FECACA" : "var(--border)";

          const priority = h?.priority || "";
          const priorityBorderColor =
            priority === "高"
              ? "#DC2626"
              : priority === "中"
                ? "#D97706"
                : "#CBD5E1";

          const dateStyle = isO
            ? "color: #DC2626; font-weight: bold;"
            : "color: var(--muted);";
          let actionHtml =
            !!p.nextActionText && p.currentStage !== "4"
              ? `<div style="font-size:12px; margin-top:6px; color:var(--text);">▶ ${p.nextActionText}</div><div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;"><span class="tag">${p.nextActionAssignee}</span><span style="font-size:11px; ${dateStyle}">期限: ${p.nextActionDate} ${isO ? "⚠️" : ""}</span></div>`
              : p.currentStage === "4"
                ? `<div style="font-size:11px; color:var(--gray); margin-top:4px;">(クロージング済: ${p.closingStatus === "won" ? "🟢受注" : "🔘失注"})</div>`
                : "";
          return `<div class="project-card" style="background-color:${bgColor}; border-color:${borderColor}; border-left:4px solid ${priorityBorderColor};" onmouseover="this.style.backgroundColor='${hoverBg}'" onmouseout="this.style.backgroundColor='${bgColor}'"><div style="display:flex; justify-content:space-between; align-items:flex-start;"><div><div style="font-size:11px; color:var(--gray); margin-bottom:2px;">${h?.name || "不明"} / ${d?.name || "未分類"}</div><div style="font-size:13px; font-weight:bold; color:var(--navy);">${p.name}</div></div><span class="stage stage-${p.currentStage || "0"}" style="margin-left:8px; flex-shrink:0;">${STAGE_LABELS[p.currentStage || "0"]}</span></div>${actionHtml}</div>`;
        })
        .join("") || '<div class="section-note">案件がありません</div>';

    $("summary-logs").innerHTML =
      monthLogs
        .sort((a, b) => new Date(b.visitDate) - new Date(a.visitDate))
        .map((l) => {
          const p = db.projects.find((p) => p.id === l.projectId);
          const h = db.accounts.find((h) => h.id === l.accountId);
          const dName = p
            ? db.departments.find((d) => d.id === p.departmentId)?.name ||
              "未分類"
            : "未分類";
          return `<div class="dash-list-item" style="background:white; border:1px solid var(--border);"><div style="display:flex; justify-content:space-between; margin-bottom:2px;"><span style="color:var(--gray); font-size:11px;">📅 ${l.visitDate}</span>${l.accompaniedBy && l.accompaniedBy !== "なし" ? `<span style="color:var(--teal); font-size:11px; font-weight:bold;">同行: ${l.accompaniedBy}</span>` : ""}</div><div style="font-size:11px; color:var(--navy); font-weight:600;">${h?.name}</div><div style="font-weight:600; font-size:12px; margin-bottom:2px; margin-top:2px;">[${dName}] ${p?.name}</div><div style="font-size:12px; white-space: pre-wrap;">${l.content}</div></div>`;
        })
        .join("") ||
      '<div class="section-note">指定月の訪問ログはありません</div>';

    const isMe = targetUserId === currentUserEmail;
    const isManager = currentUserRole === "admin" || currentUserRole === "manager";
    const canEditSelfCheck = isMe;
    const canEditManagerEval = isManager;

    const mk = `${currentYear}-${currentMonth}`;
    const userRevs = db.reviews[targetUserId] || {};
    const rev = userRevs[mk] || { eval: "", comment: "", checks: {} };

    if ($("mgr-eval")) {
      $("mgr-eval").value = rev.eval;
      $("mgr-eval").disabled = !canEditManagerEval;
    }
    if ($("mgr-comment")) {
      $("mgr-comment").value = rev.comment;
      $("mgr-comment").disabled = !canEditManagerEval;
    }
    if ($("self-check-list")) {
      $("self-check-list").innerHTML =
        db.checkItems
          .filter((q) => q.isActive || rev.checks[q.id] !== undefined)
          .map(
            (q) =>
              `<label style="cursor:${canEditSelfCheck ? "pointer" : "not-allowed"}; display:flex; align-items:center; gap:6px; font-size: 13px; opacity: ${canEditSelfCheck ? "1" : "0.6"};">
              <input type="checkbox" id="chk-${q.id}" ${rev.checks[q.id] ? "checked" : ""} style="width:auto;" ${!canEditSelfCheck ? "disabled" : ""}>
              ${!q.isActive ? '<span style="color:var(--gray); font-size:11px; font-weight:bold;"></span>' : ""} ${q.text}
            </label>`,
          )
          .join("") || '<div class="section-note">対象の設問がありません</div>';
    }
    if ($("btn-save-self-check")) {
      $("btn-save-self-check").style.display = canEditSelfCheck
        ? "block"
        : "none";
    }
    if ($("btn-save-mgr-eval")) {
      $("btn-save-mgr-eval").style.display = canEditManagerEval
        ? "block"
        : "none";
    }
  }

  // ============================================================
  // キャンペーンマスター管理
  // ============================================================

  function _getCampaignStatus(campaign) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const start = campaign.startDate ? new Date(campaign.startDate) : null;
    const end = campaign.endDate ? new Date(campaign.endDate) : null;
    if (start && start > today) return { label: "開始前", color: "#64748b" };
    if (end && end < today) return { label: "終了済み", color: "#94a3b8" };
    return { label: "期間中", color: "var(--teal)" };
  }

  function renderCampaignList() {
    const area = $("campaign-list-area");
    if (!area) return;
    const campaigns = db.campaigns || [];
    if (campaigns.length === 0) {
      area.innerHTML = '<div class="section-note">キャンペーンが登録されていません</div>';
      return;
    }
    area.innerHTML = `
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="background:var(--light-bg,#f8fafc); border-bottom:2px solid var(--border);">
            <th style="text-align:left; padding:8px 6px; font-weight:600;">キャンペーン名</th>
            <th style="text-align:left; padding:8px 6px; font-weight:600;">対象製品</th>
            <th style="text-align:left; padding:8px 6px; font-weight:600;">期間</th>
            <th style="text-align:center; padding:8px 6px; font-weight:600;">状態</th>
            <th style="padding:8px 6px;"></th>
          </tr>
        </thead>
        <tbody>
          ${campaigns
            .map((p) => {
              const st = _getCampaignStatus(p);
              const period = [p.startDate || "未設定", p.endDate || "未設定"].join(" 〜 ");
              const safeCampaignId = _escapeInlineJsString(p.id);
              return `
                <tr style="border-bottom:1px solid var(--border);">
                  <td style="padding:8px 6px; font-weight:500; color:var(--navy);">${_escapeHtml(p.name)}</td>
                  <td style="padding:8px 6px; color:var(--gray);">${_escapeHtml(p.item || "—")}</td>
                  <td style="padding:8px 6px; color:var(--gray); font-size:12px; white-space:nowrap;">${_escapeHtml(period)}</td>
                  <td style="padding:8px 6px; text-align:center; white-space:nowrap;">
                    <span style="
                      display:inline-block;
                      padding:2px 8px;
                      border-radius:12px;
                      font-size:11px;
                      font-weight:600;
                      color:white;
                      background:${st.color};
                    ">${st.label}</span>
                  </td>
                  <td style="padding:8px 6px; text-align:right; white-space:nowrap;">
                    <button class="control-btn" style="font-size:11px; padding:2px 8px; margin-right:4px;" onclick="openCampaignEdit('${safeCampaignId}')">編集</button>
                    <button class="del-btn" style="font-size:11px; padding:2px 8px; color:var(--red); border-color:var(--red);" onclick="deleteCampaignItem('${safeCampaignId}')">削除</button>
                  </td>
                </tr>
              `;
            })
            .join("")}
        </tbody>
      </table>
    `;
  }

  function openCampaignEdit(campaignId) {
    const campaign = (db.campaigns || []).find((p) => p.id === campaignId);
    if (!campaign) return;
    $("campaign-edit-id").value = campaign.id;
    $("campaign-name").value = campaign.name;
    $("campaign-item").value = campaign.item || "";
    $("campaign-description").value = campaign.description || "";
    $("campaign-start-date").value = campaign.startDate || "";
    $("campaign-end-date").value = campaign.endDate || "";
    $("campaign-form-title").textContent = "✏️ キャンペーンを編集中";
    $("campaign-cancel-btn").style.display = "";
    $("campaign-form-area").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function cancelCampaignEdit() {
    $("campaign-edit-id").value = "";
    $("campaign-name").value = "";
    $("campaign-item").value = "";
    $("campaign-description").value = "";
    $("campaign-start-date").value = "";
    $("campaign-end-date").value = "";
    $("campaign-form-title").textContent = "➕ 新規キャンペーンを追加";
    $("campaign-cancel-btn").style.display = "none";
  }

  function saveCampaignItem() {
    const name = ($("campaign-name").value || "").trim();
    if (!name) {
      Swal.fire({
        icon: "warning",
        title: "キャンペーン名は必須です",
        timer: 2000,
        showConfirmButton: false,
      });
      return;
    }
    const campaignId = $("campaign-edit-id").value || "";
    const existingCampaign = campaignId ? (db.campaigns || []).find((p) => p.id === campaignId) : null;
    const campaign = {
      id: campaignId,
      name: name,
      item: ($("campaign-item").value || "").trim(),
      description: ($("campaign-description").value || "").trim(),
      startDate: $("campaign-start-date").value || "",
      endDate: $("campaign-end-date").value || "",
    };
    showSaving();
    google.script.run
      .withSuccessHandler(function (res) {
        if (!campaign.id) {
          campaign.id = res.id;
          (db.campaigns || (db.campaigns = [])).push(campaign);
        } else {
          const idx = (db.campaigns || []).findIndex((p) => p.id === campaign.id);
          if (idx >= 0) db.campaigns[idx] = campaign;
        }
        _syncActivePlansFromCampaignMaster();
        if (typeof populateCampaignDatalist === "function") populateCampaignDatalist();
        cancelCampaignEdit();
        renderCampaignList();
        showSuccess();
      })
      .withFailureHandler(function (e) {
        showError(e, "キャンペーンの保存に失敗しました");
      })
      .saveCampaign(campaign);
  }

  function deleteCampaignItem(campaignId) {
    const campaign = (db.campaigns || []).find((p) => p.id === campaignId);
    if (!campaign) return;
    showConfirm(
      `「${_escapeHtml(campaign.name)}」を削除しますか？\n※過去の案件に登録済みのキャンペーン名はそのまま残ります。`,
      "キャンペーンの削除確認",
      function () {
        showSaving();
        google.script.run
          .withSuccessHandler(function () {
            db.campaigns = (db.campaigns || []).filter((p) => p.id !== campaignId);
            _syncActivePlansFromCampaignMaster();
            if (typeof populateCampaignDatalist === "function") populateCampaignDatalist();
            renderCampaignList();
            showSuccess();
          })
          .withFailureHandler(function (e) {
            showError(e, "キャンペーンの削除に失敗しました");
          })
          .deleteCampaign(campaignId);
      },
      "削除する",
    );
  }

  function _syncActivePlansFromCampaignMaster() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    db.activePlans = (db.campaigns || [])
      .filter((campaign) => {
        const start = campaign.startDate ? new Date(campaign.startDate) : null;
        const end = campaign.endDate ? new Date(campaign.endDate) : null;
        return (!start || start <= today) && (!end || end >= today);
      })
      .map((campaign) => ({
        name: campaign.name,
        description: campaign.description || "",
        item: campaign.item || "",
      }));
  }

</script>
